# GoReleaser v2 config for execspansql cross-platform CLI releases.
# Triggered by .github/workflows/goreleaser.yml on tag push (goreleaser-action@v6).
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json

version: 2

release:
  # Alpha tags must remain GitHub prereleases when the tag workflow publishes.
  prerelease: auto

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    # 64-bit only. GoReleaser's default arch list also includes 386, but no
    # 32-bit release asset has had a non-trivial download, and upcoming
    # dependencies (embedded Graphviz via wazero) only have an optimizing
    # compiler on amd64/arm64.
    goarch:
      - amd64
      - arm64

archives:
  - formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats:
          - zip

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
